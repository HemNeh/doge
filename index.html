<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DOGE Live Profit Calculator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .box {
    background: #1d1d1d;
    padding: 20px;
    border-radius: 12px;
    width: 350px;
    margin: auto;
    box-shadow: 0 0 10px #000;
  }
  input {
    width: 90%;
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    border: none;
  }
  button {
    padding: 10px 20px;
    background: #0f9d58;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  #livePrice {
    font-size: 22px;
    font-weight: bold;
    color: #00e676;
  }
</style>
</head>
<body>
<h2>🐕 DOGE Live Calculator</h2>
<div class="box">
  <p>Live Price (INR): <span id="livePrice">Loading...</span></p>

  <input type="number" id="invest" placeholder="Enter amount (INR)" />
  <input type="number" id="sellPrice" placeholder="Sell Price (INR)" />

  <button onclick="calculate()">Calculate Profit</button>

  <h3 id="result"></h3>
</div>

<script>
async function fetchLivePrice() {
  try {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=inr");
    const data = await res.json();
    let price = data.dogecoin.inr;
    document.getElementById("livePrice").innerText = price;
    return price;
  } catch (e) {
    document.getElementById("livePrice").innerText = "Error";
    return 14; // fallback
  }
}

async function calculate() {
  let invest = document.getElementById("invest").value;
  let sell = document.getElementById("sellPrice").value;
  let live = await fetchLivePrice();

  if (!invest || !sell) {
    document.getElementById("result").innerText = "Enter values";
    return;
  }

  let qty = invest / live;
  let finalValue = qty * sell;
  let profit = finalValue - invest;

  document.getElementById("result").innerHTML = `Quantity: ${qty.toFixed(2)} DOGE<br>Final Value: ₹${finalValue.toFixed(2)}<br>Profit: ₹${profit.toFixed(2)}`;
}

fetchLivePrice();
setInterval(fetchLivePrice, 10000);
</script>
</body>
</html>
